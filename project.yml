name: Qasqasa
options:
  bundleIdPrefix: sa.qasqasa
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Qasqasa:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/www
        type: folder
      - path: App/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.qasqasa.app
        PRODUCT_NAME: Qasqasa
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "قصقصه"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "قصقصه"
        CFBundleName: Qasqasa
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIViewControllerBasedStatusBarAppearance: true
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false
        # The video picker can offer «تصوير فيديو»; without these two keys iOS closes the app when it is chosen.
        NSCameraUsageDescription: "عشان تصوّر مقطع وتقصّه مباشرة."
        NSMicrophoneUsageDescription: "عشان يتسجل الصوت مع المقطع اللي تصوّره."
        # Saving the parts to Photos (version 1).
        NSPhotoLibraryAddUsageDescription: "عشان تحفظ الأجزاء في الصور."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
